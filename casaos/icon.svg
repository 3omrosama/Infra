<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="256" height="256" rx="56" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="252" height="252" rx="54" stroke="url(#accentGrad)" stroke-width="3" stroke-opacity="0.4" fill="none" />

  <!-- Server Blade 1 (Top) -->
  <g transform="translate(48, 52)">
    <rect width="160" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <!-- Status LEDs -->
    <circle cx="20" cy="20" r="4" fill="#10b981" />
    <circle cx="34" cy="20" r="4" fill="#06b6d4" />
    <!-- Vent lines -->
    <line x1="56" y1="16" x2="140" y2="16" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <line x1="56" y1="24" x2="120" y2="24" stroke="#334155" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Server Blade 2 (Middle) -->
  <g transform="translate(48, 102)">
    <rect width="160" height="40" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8" />
    <!-- Status LEDs -->
    <circle cx="20" cy="20" r="4" fill="#10b981" />
    <circle cx="34" cy="20" r="4" fill="#3b82f6" />
    <!-- Telemetry pulse wave -->
    <path d="M 56 20 L 76 20 L 84 10 L 92 30 L 100 14 L 108 24 L 114 20 L 140 20" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Server Blade 3 (Bottom) -->
  <g transform="translate(48, 152)">
    <rect width="160" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <!-- Status LEDs -->
    <circle cx="20" cy="20" r="4" fill="#10b981" />
    <circle cx="34" cy="20" r="4" fill="#64748b" />
    <!-- Vent lines -->
    <line x1="56" y1="16" x2="140" y2="16" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <line x1="56" y1="24" x2="130" y2="24" stroke="#334155" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Activity Indicator Flare -->
  <circle cx="206" cy="122" r="7" fill="#38bdf8" />
  <circle cx="206" cy="122" r="14" fill="#38bdf8" fill-opacity="0.25" />
</svg>
